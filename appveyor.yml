image: Visual Studio 2022

environment:
  PYTHON: "C:\\Python311-x64"

install:
  - "%PYTHON%\\python.exe -m pip install --upgrade pip"
  - "%PYTHON%\\python.exe -m pip install -r requirements.txt"
  - "%PYTHON%\\python.exe -m pip install pyinstaller"

build_script:
  - "%PYTHON%\\python.exe -m PyInstaller --onefile --windowed --name SaisieComptable --add-data \"plan_comptable.json;.\" --add-data \"etats_financiers_template.xlsx;.\" --hidden-import openpyxl --hidden-import openpyxl.cell._writer main.py"

artifacts:
  - path: dist\SaisieComptable.exe
    name: SaisieComptable-windows
